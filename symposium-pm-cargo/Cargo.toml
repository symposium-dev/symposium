[package]
name = "symposium-pm-cargo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The cargo package manager for Symposium: resolves crates from a Cargo workspace into plugin offers"
repository = "https://github.com/symposium-dev/symposium"

[lib]
name = "symposium_pm_cargo"
path = "src/lib.rs"

[dependencies]
symposium-sdk = { path = "../symposium-sdk", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
cargo_metadata = "0.18"
crates_io_api = { version = "0.12", default-features = false, features = [
    "rustls",
] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "0.8"
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
indoc = "2"
