name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check compilation
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check

  fmt:
    name: Check formatting
    needs: check
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Run tests (${{ matrix.name }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            native: true
          - name: macos
            os: macos-latest
            native: true
          - name: musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            native: false
          - name: windows
            os: windows-latest
            native: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      # Tests spawn `sh` to run script-based hooks/predicates. Git for Windows
      # ships sh.exe in usr/bin, which is not on the runner's PATH by default.
      - name: Put sh on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"

      - name: Verify sh is available (Windows)
        if: runner.os == 'Windows'
        run: sh --version

      - name: Disable agent tests
        shell: bash
        run: echo 'test-agents = []' > test-agents.toml

      - name: Test
        run: cargo test ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Check benchmarks
        if: matrix.native
        run: cargo check -p symposium-benchsuite --all-targets

  xtask:
    name: Run xtask checks
    needs: check
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-xtask-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-xtask-cargo-

      - name: Check for orphaned md files
        run: cargo xtask md-orphan-check
