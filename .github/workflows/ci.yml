name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # CI never reads debuginfo, and it makes links (slowest on Windows) and the cache much bigger.
  CARGO_PROFILE_DEV_DEBUG: 0

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check compilation
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # Only main saves: a PR's cache is scoped to its ref, so no other run could
          # restore it, and it would evict main's.
          save-if: ${{ github.event_name == 'push' }}

      - name: Check
        run: cargo check --workspace --all-targets

  fmt:
    name: Check formatting
    needs: check
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Run tests (${{ matrix.name }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
          # symposium-eval's tests and `--check-tasks` run `cargo fmt --check`.
          components: rustfmt

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' }}

      # Tests spawn `sh` to run script-based hooks/predicates. Git for Windows
      # ships sh.exe in usr/bin, which is not on the runner's PATH by default.
      - name: Put sh on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"

      - name: Verify sh is available (Windows)
        if: runner.os == 'Windows'
        run: sh --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Disable agent tests
        shell: bash
        run: echo 'test-agents = []' > test-agents.toml

      # `--workspace`: without it only the root package is tested, not the
      # SDK and the other member crates.
      # `--no-fail-fast`: without it the run stops at the first failure, so a
      # platform-specific failure hides every later one and each fix costs
      # another CI round-trip to learn what is still broken.
      # nextest runs the test binaries in parallel, which `cargo test` does not.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  xtask:
    name: Run xtask checks
    needs: check
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: xtask
          save-if: ${{ github.event_name == 'push' }}

      - name: Check for orphaned md files
        run: cargo xtask md-orphan-check

      - name: Check agent-eval tasks
        run: cargo xtask agent-eval --check-tasks
