[package]
name = "symposium-benchsuite"
version = "0.1.0"
edition = "2024"
publish = false
autobenches = false

[dependencies]
anyhow = "1.0.104"
indoc = "2.0.7"
symposium = { version = "0.4.0", path = "../.." }
tempfile = "3.27.0"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bench]]
name = "workspace_deps"
harness = false

[[bench]]
name = "hook_dispatch"
harness = false
