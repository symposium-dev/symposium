[book]
authors = ["Niko Matsakis"]
language = "en"
src = "md"
title = "Symposium"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["theme/custom.css"]
fold.enable = true
fold.level = 0
git-repository-url = "https://github.com/symposium-dev/symposium"
edit-url-template = "https://github.com/symposium-dev/symposium/edit/main/{path}"

# Redirects for pages that have been renamed. The key is the old path
# (relative to the book root, including leading slash), and the value is
# the new page (relative to the redirect's location).
[output.html.redirect]
# `crate-authors/publishing-skills.md` → `crate-authors/authoring-a-plugin.md`
# (renamed 2026-05 when the page was consolidated with the old
# `creating-a-plugin.md`).
"/crate-authors/publishing-skills.html" = "authoring-a-plugin.html"
"/crate-authors/creating-a-plugin.html" = "authoring-a-plugin.html"
"/reference/cargo-agents.html" = "symposium.html"
"/reference/cargo-agents-crate-info.html" = "symposium-crate-info.html"
"/reference/cargo-agents-hook.html" = "symposium-hook.html"
"/reference/cargo-agents-init.html" = "symposium-init.html"
"/reference/cargo-agents-plugin.html" = "symposium-plugin.html"
"/reference/cargo-agents-search.html" = "symposium-search.html"
"/reference/cargo-agents-self-update.html" = "symposium-self-update.html"
"/reference/cargo-agents-status.html" = "symposium-status.html"
"/reference/cargo-agents-sync.html" = "symposium-sync.html"
"/reference/cargo-agents-telemetry.html" = "symposium-telemetry.html"
"/reference/cargo-agents-unstable.html" = "symposium-unstable.html"
"/reference/cargo-agents-use.html" = "symposium-use.html"
