[package]
name = "symposium-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SDK for writing symposium plugins (hooks, custom predicates, subcommands)"
repository = "https://github.com/symposium-dev/symposium"

[features]
clap = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
regex = "1"
sacp = "11"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symposium-install = { version = "0.1.0", path = "../symposium-install" }
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.8"
